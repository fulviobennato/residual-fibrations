name: SCC P500 Private GHCR OCI Custody

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  private-oci-custody:
    runs-on: ubuntu-latest
    env:
      EXPECTED_ADAPTER_ZIP_SHA256: 70a6e3fcbce57b96491b3530401f1f81505b05989c255377c8828785f4ac6bae
      EXPECTED_ADAPTER_RECEIPT_SHA256: 61f1b87ab84455946561283decbf1082639846ccdb70969bf6a20cc040c1a4a0
      EXPECTED_DOCKERFILE_SHA256: 7d520949ae01c0ea6305449b32bed561e1a3b77e643bbfee38f1c1a30fb31f9a
      EXPECTED_ADAPTER_PY_SHA256: e91580cc84f4dedabecc9f64d84154bdcbdd9429f4fd2f9975e42692ad07cf58
      EXPECTED_CONFIG_SCHEMA_PY_SHA256: e8d1dd2783882fd3f04729248f143d06a3ff1ea11a36f85044640de3cf476b63
      EXPECTED_BENCHMARK_SHA256: 35e257503ff1c4d36f30634b19c5da570288dd264ec710331a69dcfed776659c
      EXPECTED_MEMBER_COUNT: "17"
      TARGET_PLATFORM: linux/amd64
      IMAGE_NAME: ghcr.io/fulviobennato/scc-adapter-v03-custodied
      PACKAGE_NAME: scc-adapter-v03-custodied
      LOCAL_IMAGE: scc-adapter-v03-p500:local
    steps:
      - name: Require private source and registry secrets
        shell: bash
        env:
          SCC_ADAPTER_V03_ZIP_B64: ${{ secrets.SCC_ADAPTER_V03_ZIP_B64 }}
          SCC_GHCR_PAT: ${{ secrets.SCC_GHCR_PAT }}
        run: |
          set -euo pipefail
          [[ -n "$SCC_ADAPTER_V03_ZIP_B64" ]] || { echo "::error::SCC_ADAPTER_V03_ZIP_B64 absent"; exit 78; }
          [[ -n "$SCC_GHCR_PAT" ]] || { echo "::error::SCC_GHCR_PAT absent"; exit 79; }

      - name: Decode and verify frozen private source
        shell: bash
        env:
          SCC_ADAPTER_V03_ZIP_B64: ${{ secrets.SCC_ADAPTER_V03_ZIP_B64 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/scc-p500/src" "$RUNNER_TEMP/scc-p500/out"
          printf '%s' "$SCC_ADAPTER_V03_ZIP_B64" | base64 --decode > "$RUNNER_TEMP/scc-p500/adapter.zip"
          got="$(sha256sum "$RUNNER_TEMP/scc-p500/adapter.zip" | awk '{print $1}')"
          test "$got" = "$EXPECTED_ADAPTER_ZIP_SHA256" || { echo "::error::adapter ZIP SHA mismatch"; exit 2; }
          python3 -I -B - <<'PY'
          import os, stat, zipfile
          from pathlib import PurePosixPath
          p=os.path.join(os.environ["RUNNER_TEMP"],"scc-p500","adapter.zip")
          with zipfile.ZipFile(p) as z:
              infos=z.infolist()
              if len(infos)!=int(os.environ["EXPECTED_MEMBER_COUNT"]):
                  raise SystemExit("wrong ZIP member count")
              if len({i.filename for i in infos})!=len(infos):
                  raise SystemExit("duplicate ZIP member")
              for i in infos:
                  q=PurePosixPath(i.filename)
                  if q.is_absolute() or ".." in q.parts:
                      raise SystemExit("unsafe ZIP path")
                  mode=(i.external_attr >> 16) & 0o170000
                  if mode == stat.S_IFLNK:
                      raise SystemExit("symlink ZIP member")
          PY
          unzip -q "$RUNNER_TEMP/scc-p500/adapter.zip" -d "$RUNNER_TEMP/scc-p500/src"
          root="$RUNNER_TEMP/scc-p500/src"
          for f in Dockerfile adapter.py config_schema.py ADAPTER_RECEIPT.json; do
            test -f "$root/$f" || { echo "::error::missing $f"; exit 3; }
          done
          test "$(sha256sum "$root/Dockerfile" | awk '{print $1}')" = "$EXPECTED_DOCKERFILE_SHA256"
          test "$(sha256sum "$root/adapter.py" | awk '{print $1}')" = "$EXPECTED_ADAPTER_PY_SHA256"
          test "$(sha256sum "$root/config_schema.py" | awk '{print $1}')" = "$EXPECTED_CONFIG_SCHEMA_PY_SHA256"
          test "$(sha256sum "$root/ADAPTER_RECEIPT.json" | awk '{print $1}')" = "$EXPECTED_ADAPTER_RECEIPT_SHA256"

      - name: Resolve immutable base and build recipe
        id: recipe
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/scc-p500/src"
          base_ref="$(awk 'BEGIN{IGNORECASE=1} $1=="FROM"{print $2; exit}' "$root/Dockerfile")"
          [[ -n "$base_ref" ]] || { echo "::error::missing Dockerfile FROM"; exit 4; }
          docker pull --platform "$TARGET_PLATFORM" "$base_ref" >/dev/null
          base_repo_digest="$(docker image inspect "$base_ref" --format '{{index .RepoDigests 0}}')"
          [[ "$base_repo_digest" == *@sha256:* ]] || { echo "::error::base not resolved to digest"; exit 5; }
          docker_server="$(docker version --format '{{.Server.Version}}')"
          buildx_version="$(docker buildx version | tr -d '\r')"
          python3 -I -B - <<'PY'
          import hashlib, json, os, pathlib
          work=pathlib.Path(os.environ["RUNNER_TEMP"])/"scc-p500"
          rec={
            "adapter_zip_sha256":os.environ["EXPECTED_ADAPTER_ZIP_SHA256"],
            "dockerfile_sha256":os.environ["EXPECTED_DOCKERFILE_SHA256"],
            "platform":os.environ["TARGET_PLATFORM"],
            "base_ref":os.environ["P500_BASE_REF"],
            "base_repo_digest":os.environ["P500_BASE_REPO_DIGEST"],
            "docker_server_version":os.environ["P500_DOCKER_SERVER"],
            "docker_buildx_version":os.environ["P500_BUILDX_VERSION"],
            "build_command":["docker","build","--no-cache","--pull=false","--platform",os.environ["TARGET_PLATFORM"],"-f","Dockerfile","-t",os.environ["LOCAL_IMAGE"],"."],
            "image_name":os.environ["IMAGE_NAME"],
            "github_repository":os.environ.get("GITHUB_REPOSITORY"),
            "github_sha":os.environ.get("GITHUB_SHA"),
          }
          b=json.dumps(rec,sort_keys=True,separators=(",",":")).encode()
          (work/"build_recipe.json").write_bytes(b+b"\n")
          print(hashlib.sha256(b).hexdigest())
          PY
        env:
          P500_BASE_REF: python:3.13-slim
          P500_BASE_REPO_DIGEST: ""
          P500_DOCKER_SERVER: ""
          P500_BUILDX_VERSION: ""

      - name: Recreate canonical build recipe with resolved values
        id: resolved
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/scc-p500/src"
          base_ref="$(awk 'BEGIN{IGNORECASE=1} $1=="FROM"{print $2; exit}' "$root/Dockerfile")"
          base_repo_digest="$(docker image inspect "$base_ref" --format '{{index .RepoDigests 0}}')"
          docker_server="$(docker version --format '{{.Server.Version}}')"
          buildx_version="$(docker buildx version | tr -d '\r')"
          export P500_BASE_REF="$base_ref"
          export P500_BASE_REPO_DIGEST="$base_repo_digest"
          export P500_DOCKER_SERVER="$docker_server"
          export P500_BUILDX_VERSION="$buildx_version"
          recipe_sha="$(python3 -I -B - <<'PY'
          import hashlib, json, os, pathlib
          work=pathlib.Path(os.environ["RUNNER_TEMP"])/"scc-p500"
          rec={
            "adapter_zip_sha256":os.environ["EXPECTED_ADAPTER_ZIP_SHA256"],
            "dockerfile_sha256":os.environ["EXPECTED_DOCKERFILE_SHA256"],
            "platform":os.environ["TARGET_PLATFORM"],
            "base_ref":os.environ["P500_BASE_REF"],
            "base_repo_digest":os.environ["P500_BASE_REPO_DIGEST"],
            "docker_server_version":os.environ["P500_DOCKER_SERVER"],
            "docker_buildx_version":os.environ["P500_BUILDX_VERSION"],
            "build_command":["docker","build","--no-cache","--pull=false","--platform",os.environ["TARGET_PLATFORM"],"-f","Dockerfile","-t",os.environ["LOCAL_IMAGE"],"."],
            "image_name":os.environ["IMAGE_NAME"],
            "github_repository":os.environ.get("GITHUB_REPOSITORY"),
            "github_sha":os.environ.get("GITHUB_SHA"),
          }
          b=json.dumps(rec,sort_keys=True,separators=(",",":")).encode()
          (work/"build_recipe.json").write_bytes(b+b"\n")
          print(hashlib.sha256(b).hexdigest())
          PY
          )"
          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"
          echo "base_repo_digest=$base_repo_digest" >> "$GITHUB_OUTPUT"
          echo "docker_server=$docker_server" >> "$GITHUB_OUTPUT"
          echo "recipe_sha=$recipe_sha" >> "$GITHUB_OUTPUT"

      - name: Build local frozen adapter image
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/scc-p500/src"
          docker build --no-cache --pull=false --platform "$TARGET_PLATFORM" -f Dockerfile -t "$LOCAL_IMAGE" .

      - name: Publish first package through PAT command-line path
        id: push
        shell: bash
        env:
          SCC_GHCR_PAT: ${{ secrets.SCC_GHCR_PAT }}
        run: |
          set -euo pipefail
          image_tag="$IMAGE_NAME:$GITHUB_SHA"
          echo "$SCC_GHCR_PAT" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          docker tag "$LOCAL_IMAGE" "$image_tag"
          docker push "$image_tag" 2>&1 | tee "$RUNNER_TEMP/scc-p500/push.log"
          digest="$(awk '/digest: sha256:/{print $2}' "$RUNNER_TEMP/scc-p500/push.log" | tail -1)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::manifest digest not found"; exit 6; }
          echo "manifest_digest=$digest" >> "$GITHUB_OUTPUT"
          echo "digest_ref=$IMAGE_NAME@$digest" >> "$GITHUB_OUTPUT"
          echo "IMAGE_MANIFEST_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST_REF=$IMAGE_NAME@$digest" >> "$GITHUB_ENV"
          docker logout ghcr.io >/dev/null || true

      - name: Require concrete GHCR package visibility private
        shell: bash
        env:
          SCC_GHCR_PAT: ${{ secrets.SCC_GHCR_PAT }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/scc-p500/package_metadata.json"
          curl -fsSL             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $SCC_GHCR_PAT"             -H "X-GitHub-Api-Version: 2026-03-10"             "https://api.github.com/user/packages/container/$PACKAGE_NAME" > "$out"
          python3 -I -B - "$out" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1],encoding="utf-8"))
          if x.get("package_type")!="container": raise SystemExit("wrong package_type")
          if x.get("visibility")!="private": raise SystemExit("PACKAGE IS NOT PRIVATE")
          clean={k:x.get(k) for k in ("id","name","package_type","visibility","version_count","created_at","updated_at","html_url")}
          json.dump(clean,open(sys.argv[1],"w"),sort_keys=True,indent=2)
          open(sys.argv[1],"a").write("\n")
          PY

      - name: Prove anonymous digest pull is rejected
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker image rm -f "$LOCAL_IMAGE" "$IMAGE_NAME:$GITHUB_SHA" >/dev/null 2>&1 || true
          anon_cfg="$RUNNER_TEMP/scc-p500/anon-docker"
          mkdir -p "$anon_cfg"
          if DOCKER_CONFIG="$anon_cfg" docker pull "$IMAGE_DIGEST_REF" >"$RUNNER_TEMP/scc-p500/anon_pull.log" 2>&1; then
            echo "::error::anonymous pull SUCCEEDED for supposedly private image"
            exit 7
          fi
          printf '%s\n' "ANONYMOUS_PULL_REJECTED" > "$RUNNER_TEMP/scc-p500/anon_pull_status.txt"

      - name: Authenticated pull exact digest
        shell: bash
        env:
          SCC_GHCR_PAT: ${{ secrets.SCC_GHCR_PAT }}
        run: |
          set -euo pipefail
          auth_cfg="$RUNNER_TEMP/scc-p500/auth-docker"
          mkdir -p "$auth_cfg"
          echo "$SCC_GHCR_PAT" | DOCKER_CONFIG="$auth_cfg" docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          DOCKER_CONFIG="$auth_cfg" docker pull "$IMAGE_DIGEST_REF"
          got="$(docker image inspect "$IMAGE_DIGEST_REF" --format '{{join .RepoDigests "\n"}}' | grep -F "$IMAGE_MANIFEST_DIGEST" | head -1 || true)"
          [[ -n "$got" ]] || { echo "::error::pulled image not bound to expected digest"; exit 8; }
          DOCKER_CONFIG="$auth_cfg" docker logout ghcr.io >/dev/null || true
          printf '%s\n' "AUTHENTICATED_PULL_PASS" > "$RUNNER_TEMP/scc-p500/auth_pull_status.txt"

      - name: Inspect pulled image and write source-to-image receipt
        shell: bash
        env:
          BASE_REF: ${{ steps.resolved.outputs.base_ref }}
          BASE_REPO_DIGEST: ${{ steps.resolved.outputs.base_repo_digest }}
          DOCKER_SERVER: ${{ steps.resolved.outputs.docker_server }}
          BUILD_RECIPE_SHA256: ${{ steps.resolved.outputs.recipe_sha }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/scc-p500"
          cid="$(docker create "$IMAGE_DIGEST_REF")"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker export "$cid" > "$work/rootfs.tar"
          mkdir "$work/rootfs"
          tar -xf "$work/rootfs.tar" -C "$work/rootfs"

          python3 -I -B - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          work=pathlib.Path(os.environ["RUNNER_TEMP"])/"scc-p500"
          root=work/"rootfs"
          def hfile(p):
              h=hashlib.sha256()
              with p.open("rb") as f:
                  for b in iter(lambda:f.read(1024*1024),b""): h.update(b)
              return h.hexdigest()
          pkg=json.load(open(work/"package_metadata.json",encoding="utf-8"))
          insp=json.loads(subprocess.check_output(["docker","image","inspect",os.environ["IMAGE_DIGEST_REF"]]))[0]
          cfg=insp.get("Config") or {}
          adapter=hfile(root/"app/adapter.py")
          schema=hfile(root/"app/config_schema.py")
          checks={
            "package_private":pkg.get("visibility")=="private",
            "anonymous_pull_rejected":(work/"anon_pull_status.txt").read_text().strip()=="ANONYMOUS_PULL_REJECTED",
            "authenticated_pull_pass":(work/"auth_pull_status.txt").read_text().strip()=="AUTHENTICATED_PULL_PASS",
            "entrypoint":cfg.get("Entrypoint")==["python","/app/adapter.py"],
            "user":cfg.get("User")=="65532:65532",
            "workdir":cfg.get("WorkingDir")=="/app",
            "adapter_py":adapter==os.environ["EXPECTED_ADAPTER_PY_SHA256"],
            "config_schema_py":schema==os.environ["EXPECTED_CONFIG_SCHEMA_PY_SHA256"],
          }
          rec={
            "schema":"scc-private-oci-registry-custody/1",
            "protocol_parent":"scc-oci-source-image-provenance-requirement/0.6",
            "checks":checks,
            "pass":all(checks.values()),
            "source":{
              "adapter_zip_sha256":os.environ["EXPECTED_ADAPTER_ZIP_SHA256"],
              "adapter_receipt_sha256":os.environ["EXPECTED_ADAPTER_RECEIPT_SHA256"],
              "dockerfile_sha256":os.environ["EXPECTED_DOCKERFILE_SHA256"],
              "adapter_py_sha256":os.environ["EXPECTED_ADAPTER_PY_SHA256"],
              "config_schema_py_sha256":os.environ["EXPECTED_CONFIG_SCHEMA_PY_SHA256"],
              "benchmark_parent_sha256":os.environ["EXPECTED_BENCHMARK_SHA256"],
            },
            "build":{
              "platform":os.environ["TARGET_PLATFORM"],
              "base_ref":os.environ["BASE_REF"],
              "base_repo_digest":os.environ["BASE_REPO_DIGEST"],
              "docker_server_version":os.environ["DOCKER_SERVER"],
              "build_recipe_invocation_sha256":os.environ["BUILD_RECIPE_SHA256"],
            },
            "image":{
              "name":os.environ["IMAGE_NAME"],
              "manifest_digest":os.environ["IMAGE_MANIFEST_DIGEST"],
              "digest_ref":os.environ["IMAGE_DIGEST_REF"],
              "os":insp.get("Os"),
              "architecture":insp.get("Architecture"),
              "config":{
                "Entrypoint":cfg.get("Entrypoint"),
                "Cmd":cfg.get("Cmd"),
                "WorkingDir":cfg.get("WorkingDir"),
                "User":cfg.get("User"),
              },
              "rootfs_app_adapter_py_sha256":adapter,
              "rootfs_app_config_schema_py_sha256":schema,
            },
            "package":pkg,
            "github":{
              "repository":os.environ.get("GITHUB_REPOSITORY"),
              "sha":os.environ.get("GITHUB_SHA"),
              "run_id":os.environ.get("GITHUB_RUN_ID"),
              "run_attempt":os.environ.get("GITHUB_RUN_ATTEMPT"),
            },
            "source_uploaded_as_public_artifact":False,
          }
          out=work/"out"/"p500_private_oci_custody_receipt.json"
          out.write_text(json.dumps(rec,sort_keys=True,indent=2)+"\n")
          print(json.dumps({"pass":rec["pass"],"digest_ref":rec["image"]["digest_ref"],"checks":checks},sort_keys=True))
          if not rec["pass"]: raise SystemExit(9)
          PY
          sha256sum "$work/out/p500_private_oci_custody_receipt.json"

      - name: Upload non-secret custody receipt only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scc-p500-private-oci-custody-receipt
          path: ${{ runner.temp }}/scc-p500/out/p500_private_oci_custody_receipt.json
          if-no-files-found: error

      - name: Attest custody receipt
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/scc-p500/out/p500_private_oci_custody_receipt.json

      - name: Attest exact OCI image subject
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ env.IMAGE_MANIFEST_DIGEST }}
          push-to-registry: false
