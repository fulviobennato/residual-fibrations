name: SCC P476 External Transcript Verifier

on:
  push:
    branches:
      - scc-p476-stdout-custody-smoke

permissions:
  actions: read
  contents: read
  id-token: write
  attestations: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SOURCE_RUN_ID: "35556655213"
      SOURCE_JOB_ID: "106201460746"
      SOURCE_ARTIFACT_ID: "10621086223"
      SOURCE_ARTIFACT_ZIP_SHA256: "acdd69df27d7f61c49189e5e22b40d5e80c1015344c3d321b5b0cfa7e402f36e"
      SOURCE_LOCAL_RECEIPT_SHA256: "300fe8181a0ef3c8caabd9600b0a330493f73746f44ebc0e51ec32f4fbeb0931"
      SOURCE_RAW_CAPTURE_SHA256: "b65762da84bcd47e84b905984808d843cc1e4dc5ce7a62dc16ba60da35532ca0"
    steps:
      - name: Fetch immutable GitHub job log and artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/p476-verify"
          mkdir -p "$OUT"
          curl -fsSL             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/$SOURCE_JOB_ID/logs"             -o "$OUT/source_job.log"
          curl -fsSL             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/$SOURCE_ARTIFACT_ID/zip"             -o "$OUT/source_artifact.zip"
          printf '%s  %s\n' "$SOURCE_ARTIFACT_ZIP_SHA256" "$OUT/source_artifact.zip" | sha256sum -c -
          unzip -q "$OUT/source_artifact.zip" -d "$OUT/artifact"
          printf '%s  %s\n' "$SOURCE_LOCAL_RECEIPT_SHA256" "$OUT/artifact/P476_LOCAL_TRANSCRIPT_RECEIPT.json" | sha256sum -c -
          printf '%s  %s\n' "$SOURCE_RAW_CAPTURE_SHA256" "$OUT/artifact/raw_capture.jsonl" | sha256sum -c -
          sha256sum "$OUT/source_job.log" > "$OUT/source_job.log.sha256"

      - name: Cross-compare external transcript against local artifact
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/p476-verify"
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, re
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"p476-verify"
          log_bytes=out.joinpath("source_job.log").read_bytes()
          log=log_bytes.decode("utf-8-sig",errors="strict")
          markers=[]
          for line in log.splitlines():
              m=re.search(r'(SCC_PROVIDER_(?:REQUEST|RESPONSE)_V1)\s+([A-Za-z0-9+/=]+)',line)
              if m:
                  markers.append((m.group(1),json.loads(base64.b64decode(m.group(2),validate=True))))
          expected_markers=["SCC_PROVIDER_REQUEST_V1","SCC_PROVIDER_RESPONSE_V1","SCC_PROVIDER_REQUEST_V1","SCC_PROVIDER_RESPONSE_V1"]
          assert [x[0] for x in markers]==expected_markers, [x[0] for x in markers]
          local=[json.loads(x) for x in out.joinpath("artifact","raw_capture.jsonl").read_text().splitlines()]
          assert len(local)==2
          compared=[]
          for i,e in enumerate(local):
              req=markers[2*i][1]; resp=markers[2*i+1][1]
              assert req["sequence_index"]==i==resp["sequence_index"]==e["sequence_index"]
              assert req["gateway_event_id"]==resp["gateway_event_id"]==e["gateway_event_id"]
              assert req["request_body_b64"]==e["request_body_b64"]
              assert req["request_body_sha256"]==e["request_body_sha256"]
              assert req["adapter_url"]==e["url"]
              assert req["upstream_url"]==e["upstream_url"]
              assert req["provider_scope_id_hash"]==e["provider_scope_id_hash"]
              assert req["semantic_routing_surface"]==e["semantic_routing_surface"]
              assert req["authorization_secret_exported"] is False
              assert resp["response_body_b64"]==e["response_body_b64"]
              assert resp["response_body_sha256"]==e["response_body_sha256"]
              assert resp["provider_request_id"]==e["provider_request_id"]
              assert resp["provider_http_request_id"]==e["provider_http_request_id"]
              assert resp["provider_reported_model"]==e["provider_reported_model"]
              assert resp["provider_http_status"]==e["provider_http_status"]
              assert resp["provider_transport_error"]==e["provider_transport_error"]
              assert req["gateway_request_started_ns"]==resp["gateway_request_started_ns"]==e["gateway_request_started_ns"]
              assert resp["gateway_response_received_ns"]==e["gateway_response_received_ns"]
              assert req["gateway_request_started_ns"] <= resp["gateway_response_received_ns"]
              compared.append({
                "sequence_index":i,
                "gateway_event_id":e["gateway_event_id"],
                "request_body_sha256":e["request_body_sha256"],
                "response_body_sha256":e["response_body_sha256"],
                "provider_request_id":e["provider_request_id"],
                "provider_http_request_id":e["provider_http_request_id"],
                "provider_reported_model":e["provider_reported_model"]
              })
          receipt={
            "protocol":"scc-p476-external-transcript-custody-verification/0.1",
            "evidence_status":"SYNTHETIC_EXTERNAL_CUSTODY_MECHANICS_VALIDATION_NOT_REAL_MODEL_EVIDENCE",
            "source_run_id":int(os.environ["SOURCE_RUN_ID"]),
            "source_job_id":int(os.environ["SOURCE_JOB_ID"]),
            "source_artifact_id":int(os.environ["SOURCE_ARTIFACT_ID"]),
            "source_job_log_sha256":hashlib.sha256(log_bytes).hexdigest(),
            "source_artifact_zip_sha256":hashlib.sha256(out.joinpath("source_artifact.zip").read_bytes()).hexdigest(),
            "source_raw_capture_sha256":hashlib.sha256(out.joinpath("artifact","raw_capture.jsonl").read_bytes()).hexdigest(),
            "external_record_count":len(markers),
            "local_event_count":len(local),
            "strict_external_order_pass":True,
            "one_request_one_response_pairing_pass":True,
            "external_vs_local_byte_identity_pass":True,
            "external_vs_local_metadata_identity_pass":True,
            "authorization_secret_absent_from_external_records":all(
                (m[1].get("authorization_secret_exported") is False) if m[0]=="SCC_PROVIDER_REQUEST_V1" else True
                for m in markers
            ),
            "compared_events":compared,
            "github_sha":os.environ["GITHUB_SHA"],
            "github_run_id":os.environ["GITHUB_RUN_ID"],
            "real_model_receipt":False
          }
          raw=(json.dumps(receipt,sort_keys=True,indent=2)+"\n").encode()
          out.joinpath("P476_EXTERNAL_TRANSCRIPT_CUSTODY_RECEIPT.json").write_bytes(raw)
          print(json.dumps(receipt,sort_keys=True))
          PY
          sha256sum "$OUT/P476_EXTERNAL_TRANSCRIPT_CUSTODY_RECEIPT.json"

      - name: Upload comparison receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scc-p476-external-transcript-custody-verification
          path: ${{ runner.temp }}/p476-verify/P476_EXTERNAL_TRANSCRIPT_CUSTODY_RECEIPT.json
          if-no-files-found: error

      - name: Attest comparison receipt
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/p476-verify/P476_EXTERNAL_TRANSCRIPT_CUSTODY_RECEIPT.json
