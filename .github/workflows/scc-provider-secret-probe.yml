name: SCC Provider Credential Presence Probe

on:
  push:
    branches:
      - scc-gate3-custody

permissions:
  contents: read

jobs:
  provider-probe:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
    steps:
      - name: Report provider credential availability without exposing values
        shell: bash
        run: |
          set -euo pipefail
          any=0
          for name in OPENAI_API_KEY ANTHROPIC_API_KEY OPENROUTER_API_KEY TOGETHER_API_KEY; do
            if [ -n "${!name:-}" ]; then
              echo "$name=PRESENT"
              any=1
            else
              echo "$name=ABSENT"
            fi
          done
          if [ "$any" -eq 0 ]; then
            echo "NO_PROVIDER_CREDENTIAL_PRESENT"
          fi
